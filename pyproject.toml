[project]
name = "credit-risk-scoring"
version = "0.1.0"
description = "Explainable and cost-sensitive credit risk research infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "PyYAML==6.0.2",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "joblib==1.4.2",
    "xgboost==2.1.4",
    "shap==0.46.0",
    "imbalanced-learn==0.12.4",
]

[dependency-groups]
dev = ["pytest==8.3.3"]
notebook = ["nbformat==5.10.4", "nbconvert==7.16.4", "ipykernel==6.29.5", "jupytext==1.19.6", "jupyterlab==4.3.5"]
download = ["kaggle==2.2.5"]

[tool.uv]
package = false
default-groups = ["dev", "notebook", "download"]
# Keep installed baseline versions, including transitives, during this migration.
