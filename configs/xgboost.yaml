# Member 3: XGBoost and class-imbalance experiments (E2, E3).
# Shared settings (random_seed, split_ratios, paths, target) live in default.yaml.

threshold: 0.5            # fixed reporting threshold; threshold tuning belongs to Member 5

tuning:
  cv: 3                   # stratified folds on TRAIN only (same as Member 2)
  n_iter: 20              # random combinations per strategy (same for all = fair E2)

strategies: [standard, weighted, smote]

search_space:             # unprefixed names; the code adds model__ / model__model__
  n_estimators: [200, 400, 600]
  max_depth: [3, 4, 5, 6]
  learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
  "subsample": [0.6, 0.7, 0.8, 0.9, 1.0]
  "colsample_bytree": [0.6, 0.7, 0.8, 0.9, 1.0]
  "min_child_weight": [1, 3, 5, 10]
  "reg_lambda": [0.1, 1.0, 5.0, 10.0]